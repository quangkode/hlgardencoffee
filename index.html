function dongChiTietKho(){
  var o = $('#kOverlay'), p = $('#kDetail');
  if (o) o.classList.remove('show');
  if (p) p.classList.remove('show');
}

function moChiTietKho(x){
  var p = $('#kDetail'), o = $('#kOverlay');
  if (!p || !o) return;
  // Render detail panel for item x
  var d = S.cache.kho;
  // Find all phieu entries for this item
  var lichSu = [];
  (d.phieu || []).forEach(function(ph){
    (ph.items || []).forEach(function(it){
      if (it.maHang === x.maHang) {
        lichSu.push({ ngay: ph.ngay, maCa: ph.maCa, hoTen: ph.hoTen, tonTruoc: it.tonTruoc, nhapThem: it.nhapThem, thucTe: it.thucTe, haoHut: it.haoHut });
      }
    });
  });

  p.innerHTML =
    '<button class="dp-close" onclick="dongChiTietKho()">&times;</button>' +
    '<div class="dp-title">' + h(x.tenHang) + '</div>' +
    '<div class="dp-sub">' + h(x.donVi) + (x.tonDinhMuc ? ' \u00b7 \u0110M ' + x.tonDinhMuc : '') + '</div>' +
    '<div class="grid2 mb">' +
      '<div class="stat' + (x.duoiDinhMuc ? ' err' : '') + '"><div class="v">' + x.tonHienTai + '</div><div class="l">Tồn hiện tại</div></div>' +
      '<div class="stat"><div class="v">' + x.soLanKiem + '</div><div class="l">Lần kiểm trong kỳ</div></div>' +
    '</div>' +
    '<div class="grid2 mb">' +
      '<div class="stat ok"><div class="v">' + (x.tongNhap || 0) + '</div><div class="l">Nhập (đã duyệt)</div></div>' +
      '<div class="stat"><div class="v">' + (x.tongXuat || 0) + '</div><div class="l">Xuất (đã duyệt)</div></div>' +
    '</div>' +
    '<div class="sec-title">Lịch sử kiểm trong kỳ (' + lichSu.length + ')</div>' +
    (lichSu.length ? '<div class="card tight"><div class="scrollx">' + bangTonKho(lichSu, [
      { t:'Ngày', f:function(r){ return h(ngayNgan(r.ngay)); } },
      { t:'Ca', f:function(r){ return h(r.maCa); } }
    ]) + '</div></div>' : '<div class="small muted">Không có dữ liệu.</div>');

  o.classList.add('show');
  p.classList.add('show');
}

var CHART_COLORS = ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16'];

function bangTonKho(rows, cotDau){
  return '<table class="tbl kk"><tr>' +
    cotDau.map(function(c){ return '<th>' + c.t + '</th>'; }).join('') +
    '<th>Trước</th><th>Nhập</th><th>Tồn kho</th></tr>' +
    rows.map(function(r){
      return '<tr>' + cotDau.map(function(c){ return '<td>' + c.f(r) + '</td>'; }).join('') +
        '<td>' + r.tonTruoc + '</td><td>' + r.nhapThem + '</td>' +
        '<td' + (r.duoiDinhMuc ? ' style="color:var(--err);font-weight:700"' : '') + '>' + r.thucTe + '</td></tr>';
    }).join('') + '</table>';
}

var _locTK = { q: '', nhom: '', het: false };

function veDsTonKho(){
  var L = _locTK, q = boDau(L.q);
  var tatCa = S.cache.tonKhoDayDu || [];
  var ds = tatCa.filter(function(x){
    if (q && boDau(x.tenHang).indexOf(q) < 0) return false;
    if (L.nhom && x.nhomHang !== L.nhom) return false;
    if (L.het && !x.duoiDinhMuc) return false;
    return true;
  });
  S.cache.dsTonKho = ds;
  $('#tkDem').textContent = 'Hiện ' + ds.length + ' / ' + tatCa.length + ' mặt hàng';
  $('#tkList').innerHTML = ds.length
    ? '<table class="tbl kk"><tr><th>Hàng</th><th>Tồn</th><th>Nhập</th><th>Xuất</th></tr>' +
      ds.map(function(x, i){
        return '<tr style="cursor:pointer" onclick="moChiTietKho(S.cache.dsTonKho[' + i + '])">' +
          '<td>' + h(x.tenHang) + ' <span class="xs muted">' + h(x.donVi) + '</span></td>' +
          '<td' + (x.duoiDinhMuc ? ' style="color:var(--err);font-weight:700"' : '') + '>' + x.tonHienTai + '</td>' +
          '<td>' + (x.tongNhap || 0) + '</td><td>' + (x.tongXuat || 0) + '</td></tr>';
      }).join('') + '</table>'
    : trong('&#128269;', 'Không có mặt hàng nào khớp bộ lọc.');
}

var _locPK = { tt: '', nv: '', ca: '', q: '' };

function boDau(x){
  return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
}

function veDsPhieuKiem(){
  var L = _locPK, q = boDau(L.q);
  var tatCa = S.cache.kho.phieu;
  var ds = tatCa.filter(function(p){
    var tt = p.trangThaiDuyet || 'DaDuyet';
    if (L.tt && tt !== L.tt) return false;
    if (L.nv && p.hoTen !== L.nv) return false;
    if (L.ca && p.maCa !== L.ca) return false;
    if (q && !p.items.some(function(i){ return boDau(i.tenHang).indexOf(q) >= 0; })) return false;
    return true;
  });
  $('#pkDem').textContent = 'Hiện ' + ds.length + ' / ' + tatCa.length + ' phiếu trong khoảng ngày đã chọn';
  $('#pkList').innerHTML = ds.length ? ds.map(function(p){
      var ttDuyet = p.trangThaiDuyet;
      var badge = ttDuyet === 'ChoDuyet' ? '<span class="chip warn">Chờ duyệt</span>'
        : ttDuyet === 'TuChoi' ? '<span class="chip err">Từ chối</span>'
        : ttDuyet === 'DaDuyet' ? '<span class="chip ok">Đ\u00e3 duyệt</span>'
        : '<span class="chip grey">c\u0169</span>';
      return '<div class="card tight">' +
        '<div class="spread"><div><b>' + h(ngayVN(p.ngay)) + '</b> \u00b7 ' + h(p.maCa) + ' \u00b7 ' + h(p.hoTen) + '</div>' +
        badge + '</div>' +
        '<div class="scrollx mt">' + bangTonKho(p.items.filter(function(i){ return !q || boDau(i.tenHang).indexOf(q) >= 0; }),
          [{ t:'Hàng', f:function(i){ return h(i.tenHang); } }]) + '</div>' +
        (ttDuyet === 'ChoDuyet' ? '<div class="pc-actions mt">' +
          '<button class="btn ok grow sm" onclick="duyetKiemKho(\'' + p.id + '\',true)">\u2713 Duyệt</button>' +
          '<button class="btn err sm" onclick="duyetKiemKho(\'' + p.id + '\',false)">\u2717 Từ chối</button></div>' : '') +
        (p.items.filter(function(i){ return i.ghiChu; }).length
          ? '<div class="xs muted mt">' + h(p.items.filter(function(i){ return i.ghiChu; })
              .map(function(i){ return i.tenHang + ': ' + i.ghiChu; }).join(' \u00b7 ')) + '</div>' : '') +
        '</div>';
  }).join('') : trong('&#128269;', 'Không có phiếu nào khớp bộ lọc.');
}

function tabKhoQL(n){
  ['#kT1','#kT2','#kT3','#kT4','#kT5'].forEach(function(s, i){ $(s).className = (i + 1 === n) ? 'on' : ''; });
  var d = S.cache.kho, b = $('#kBody');

  if (n === 1){
    var soChoDuyet = (d.phieuChoDuyet || []).length;
    var soChoNX = (d.phieuNXChoDuyet || []).length;
    var dsTon = d.thongKe.slice().sort(function(x, y){
      return (y.duoiDinhMuc ? 1 : 0) - (x.duoiDinhMuc ? 1 : 0) || String(x.tenHang).localeCompare(String(y.tenHang), 'vi');
    });
    S.cache.tonKhoDayDu = dsTon;

    b.innerHTML =
      '<div class="kpi-grid">' +
        '<div class="kpi-card c2"><div class="kpi-ic">&#128230;</div><div class="kpi-v anim-v">' + (d.soMHKiem || 0) + '</div><div class="kpi-l">Mặt hàng</div></div>' +
        '<div class="kpi-card c3"><div class="kpi-ic">&#9888;</div><div class="kpi-v anim-v" style="color:var(--warn)">' + (d.soMHDuoiDM || 0) + '</div><div class="kpi-l">Sắp hết</div></div>' +
        '<div class="kpi-card c4"><div class="kpi-ic">&#128203;</div><div class="kpi-v anim-v">' + (soChoDuyet + soChoNX + (d.phieuDemChoDuyet || []).length) + '</div><div class="kpi-l">Chờ duyệt</div></div>' +
      '</div>' +
      '<div id="khoCho"></div>' +

      (dsTon.length ? '<div class="card"><div class="spread" style="margin-bottom:8px"><b style="font-size:13px">Tồn kho hiện tại</b>' +
        '<span class="xs muted">Bấm vào món để xem chi tiết</span></div>' +
        '<input class="inp" id="tkQ" placeholder="Tìm mặt hàng…" value="' + h(_locTK.q) + '">' +
        '<div class="grid2 mt">' +
          '<select class="inp" id="tkNhom"><option value="">Mọi nhóm</option>' +
            dsTon.map(function(x){ return x.nhomHang; }).filter(function(v, i, arr){ return arr.indexOf(v) === i; }).sort()
              .map(function(x){ return '<option' + (_locTK.nhom === x ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') +
          '</select>' +
          '<label class="small" style="display:flex;align-items:center;gap:6px">' +
            '<input type="checkbox" id="tkHet"' + (_locTK.het ? ' checked' : '') + '> Chỉ món sắp hết</label>' +
        '</div>' +
        '<div class="xs muted mt" id="tkDem"></div>' +
        '<div class="scrollx mt" id="tkList"></div>' +
        '<div class="xs muted mt">Nhập/Xuất: số đã duyệt trong khoảng ngày đang xem.</div></div>' : '') +

      // Pending approval section
      (soChoDuyet > 0 ? '<div class="pending-section"><div class="sec-title">Phiếu chờ duyệt <span class="chip warn">' + soChoDuyet + '</span></div>' +
        d.phieuChoDuyet.map(function(p){
          return '<div class="pending-card">' +
            '<div class="pc-top"><div class="pc-info">' + h(p.hoTen) + '</div>' +
            '<span class="chip warn">' + p.soMatHang + ' MH' + (p.soCanhBao ? ' \u00b7 ' + p.soCanhBao + ' \u26a0' : '') + '</span></div>' +
            '<div class="pc-meta">' + h(ngayVN(p.ngay)) + ' \u00b7 ' + h(p.maCa) + ' \u00b7 ' + h(p.thoiGian) + '</div>' +
            '<div class="pc-actions">' +
              '<button class="btn ok grow sm" onclick="duyetKiemKho(\'' + p.id + '\',true)">\u2713 Duyệt</button>' +
              '<button class="btn err sm" onclick="duyetKiemKho(\'' + p.id + '\',false)">\u2717 Từ chối</button></div></div>';
        }).join('') + '</div>' : '');

    // Mọi phiếu chờ duyệt dồn lên đầu (ngay dưới các ô số), không bắt cuộn qua bảng tồn kho dài
    var ps = b.querySelector('.pending-section');
    if (ps) $('#khoCho').appendChild(ps);

    var nxCho = d.phieuNXChoDuyet || [];
    if (nxCho.length) {
      $('#khoCho').innerHTML += '<div class="sec-title">Nhập/xuất chờ duyệt <span class="chip warn">' + nxCho.length + '</span></div>' +
        nxCho.map(function(p){ return theNhapXuat(p, true); }).join('');
    }

    var demCho = d.phieuDemChoDuyet || [];
    if (demCho.length) {
      $('#khoCho').innerHTML += '<div class="sec-title">Kiểm kho chờ duyệt <span class="chip warn">' + demCho.length + '</span></div>' +
        demCho.map(function(p){ return theDemKho(p, true); }).join('');
    }

    if ($('#tkList')) {
      $('#tkQ').oninput = function(){ _locTK.q = this.value; veDsTonKho(); };
      $('#tkNhom').onchange = function(){ _locTK.nhom = this.value; veDsTonKho(); };
      $('#tkHet').onchange = function(){ _locTK.het = this.checked; veDsTonKho(); };
      veDsTonKho();
    }

  } else if (n === 2){
    var dsNV = [], dsCaPK = [];
    d.phieu.forEach(function(p){
      if (dsNV.indexOf(p.hoTen) < 0) dsNV.push(p.hoTen);
      if (dsCaPK.indexOf(p.maCa) < 0) dsCaPK.push(p.maCa);
    });
    var L = _locPK;
    var chipTT = function(v, t){
      return '<button class="btn sm ' + (L.tt === v ? '' : 'ghost') + '" data-tt="' + v + '">' + t + '</button>';
    };
    b.innerHTML =
      '<div class="card tight">' +
        '<div class="row wrap" style="gap:6px;margin-bottom:8px">' +
          chipTT('', 'Tất cả') + chipTT('ChoDuyet', 'Chờ duyệt') + chipTT('DaDuyet', 'Đã duyệt') + chipTT('TuChoi', 'Từ chối') +
        '</div>' +
        '<div class="grid2">' +
          '<select class="inp" id="pkNV"><option value="">Mọi nhân viên</option>' +
            dsNV.sort().map(function(x){ return '<option' + (L.nv === x ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select>' +
          '<select class="inp" id="pkCa"><option value="">Mọi ca</option>' +
            dsCaPK.sort().map(function(x){ return '<option' + (L.ca === x ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select>' +
        '</div>' +
        '<input class="inp mt" id="pkQ" placeholder="Tìm mặt hàng…" value="' + h(L.q) + '">' +
      '</div>' +
      '<div class="xs muted mb" id="pkDem"></div>' +
      '<div id="pkList"></div>';

    $$('[data-tt]').forEach(function(e){
      e.onclick = function(){ _locPK.tt = e.getAttribute('data-tt'); tabKhoQL(2); };
    });
    $('#pkNV').onchange = function(){ _locPK.nv = this.value; veDsPhieuKiem(); };
    $('#pkCa').onchange = function(){ _locPK.ca = this.value; veDsPhieuKiem(); };
    $('#pkQ').oninput = function(){ _locPK.q = this.value; veDsPhieuKiem(); };
    veDsPhieuKiem();

  } else if (n === 5){
    var dsDem = d.phieuDem || [];
    b.innerHTML = dsDem.length ? dsDem.map(function(p){ return theDemKho(p, true); }).join('')
      : trong('&#128203;', 'Chưa có bản kiểm kho nào của nhân viên trong khoảng này.');

  } else if (n === 4){
    var ds = d.phieuNX || [];
    b.innerHTML = ds.length ? ds.map(function(p){ return theNhapXuat(p, true); }).join('')
      : trong('&#128230;', 'Chưa có phiếu nhập/xuất nào trong khoảng này.');

  } else {
    b.innerHTML =
      '<div class="card center" style="padding:18px 14px">' +
        '<div class="small muted" style="margin-bottom:10px">Có thể nhập hàng loạt từ Excel, hoặc thêm/sửa/xoá từng món bên dưới.</div>' +
        '<button class="btn block" onclick="moNhapExcelKho()">&#128229; Nhập kho từ Excel</button>' +
      '</div>' +
      '<div class="row mb" style="gap:8px"><button class="btn ghost grow" onclick="suaHang(null)">&#10133; Thêm mặt hàng</button>' +
      '<button class="btn ghost grow" onclick="khoiPhucHang()">&#8634; Khôi phục món còn thiếu</button></div>' +
      '<div class="card tight">' + (d.danhMuc.length ? d.danhMuc.map(function(x){
        return '<div class="item">' +
          '<div class="grow" style="cursor:pointer" onclick="suaHang(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')">' +
          '<div class="t1">' + h(x.tenHang) +
          (x.trangThai !== 'HoatDong' ? ' <span class="chip grey">ngừng</span>' : '') + '</div>' +
          '<div class="t2">' + h(x.donVi) + ' · ' + h(x.nhomHang) +
          ' · ĐM ' + x.tonDinhMuc + ' · ' + tien(x.giaVon) + '</div></div>' +
          '<button class="btn sm ghost" onclick="xoaHang(\'' + h(x.maHang) + '\',\'' + h(x.tenHang).replace(/'/g,"&#39;") + '\')">&times;</button></div>';
      }).join('') : trong('&#128230;', 'Chưa có mặt hàng nào.')) + '</div>';
  }
}

function khoiPhucHang(){
  api('ql.khoiPhucHang', {}).then(function(r){
    if (!r.ds.length){ toast('Danh mục đã đủ món, không thiếu món nào so với dữ liệu kho.', 'ok'); return; }
    moSheet({
      title: '↺ Khôi phục món còn thiếu',
      body: '<p class="small muted">Các món dưới đây có dữ liệu kho nhưng đang không có trong danh mục (thường do bị xoá nhầm). ' +
            'Khôi phục sẽ giữ đúng mã cũ nên tồn kho không bị mất.</p>' +
            '<div class="card tight">' + r.ds.map(function(x){
              return '<div class="item"><div class="grow"><div class="t1">' + h(x.tenHang) + '</div>' +
                '<div class="t2">' + h(x.donVi) + ' · mã ' + h(x.maHang) + '</div></div></div>';
            }).join('') + '</div>' +
            '<button class="btn block" id="_khOk">Khôi phục ' + r.ds.length + ' món</button>',
      onMount: function(){
        $('#_khOk').onclick = function(){
          api('ql.khoiPhucHang', { xacNhan: true }).then(function(r2){ dongSheet(); toast(r2.thongBao, 'ok', 8000); lamMoi(); })
            .catch(function(e){ toast(e.message, 'err'); });
        };
      }
    });
  }).catch(function(e){ toast(e.message, 'err'); });
}

function xoaHang(maHang, tenHang){
  xacNhan('Xoá mặt hàng "' + tenHang + '" khỏi danh mục?\nLịch sử kiểm kho cũ vẫn được giữ nguyên.',
          { ok:'Xoá', nguyHiem:true }).then(function(y){
    if (!y) return;
    api('ql.xoaHang', { maHang: maHang }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });
  });
}

function duyetKiemKho(id, duyet){
  var msg = duyet ? 'Duyệt phiếu kiểm kho này?' : 'Từ chối phiếu kiểm kho này?';
  xacNhan(msg, { ok: duyet ? 'Duyệt' : 'Từ chối', nguyHiem: !duyet }).then(function(y){
    if (!y) return;
    api('ql.duyetKiemKho', { id: id, duyet: duyet }).then(function(r){
      toast(r.thongBao, 'ok'); lamMoi();
    }).catch(function(e){ toast(e.message, 'err'); });
  });
}

function suaHang(x){
  x = x || { maHang:'', tenHang:'', donVi:'', nhomHang:'Nguy\u00ean li\u1ec7u', tonDinhMuc:0, giaVon:0, trangThai:'HoatDong' };
  var isNew = !x.maHang;
  moSheet({
    title: isNew ? '\ud83d\udce6 Th\u00eam m\u1eb7t h\u00e0ng' : '\ud83d\udce6 ' + x.tenHang,
    body: fForm([
      { k:'tenHang', label:'T\u00ean h\u00e0ng', type:'text', value:x.tenHang },
      { k:'donVi', label:'\u0110\u01a1n v\u1ecb t\u00ednh', type:'text', value:x.donVi, ph:'kg / lon / c\u00e1i\u2026' },
      { k:'nhomHang', label:'Nh\u00f3m', type:'select', value:x.nhomHang,
        options:['Nguy\u00ean li\u1ec7u','V\u1eadt t\u01b0','H\u00e0ng b\u00e1n','Hoa quả','Kh\u00e1c'] },
      { k:'tonDinhMuc', label:'T\u1ed3n \u0111\u1ecbnh m\u1ee9c (c\u1ea3nh b\u00e1o khi th\u1ea5p h\u01a1n)', type:'number', value:x.tonDinhMuc },
      { k:'giaVon', label:'Gi\u00e1 v\u1ed1n / \u0111\u01a1n v\u1ecb', type:'number', value:x.giaVon },
      { k:'trangThai', label:'Tr\u1ea1ng th\u00e1i', type:'select', value:x.trangThai,
        options:[{ v:'HoatDong', t:'\u0110ang theo d\u00f5i' }, { v:'NgungTheoDoi', t:'Ng\u1eebng theo d\u00f5i' }] }
    ]) + '<button class="btn block" id="_hOk">L\u01b0u</button>',
    onMount: function(root){
      $('#_hOk').onclick = function(){
        var data = fRead(root);
        data.maHang = x.maHang || ''; // empty = auto-generate
        api('ql.luuHang', data).then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
          .catch(function(e){ toast(e.message, 'err'); });
      };
    }
  });
}

function docFileBase64(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function(){ rej(new Error('Không đọc được file trên máy.')); };
    fr.readAsDataURL(file);
  });
}

function moNhapExcelKho(){
  var b64 = '';
  moSheet({
    title: '📥 Nhập kho từ Excel',
    body:
      '<p class="small muted">Chọn file .xls/.xlsx kiểm kho theo ngày — mỗi sheet là một ngày, tên sheet ' +
      'dạng "10-8". Mặt hàng chưa có trong danh mục sẽ được tự tạo (nhóm "Nhập từ Excel").</p>' +
      '<input type="file" class="inp" id="nkFile" accept=".xls,.xlsx">' +
      '<div id="nkKq" class="mt"></div>',
    onMount: function(root){
      $('#nkFile', root).onchange = function(e){
        var f = e.target.files[0];
        if (!f) return;
        $('#nkKq').innerHTML = '<div class="xs muted">Đang đọc file…</div>';
        docFileBase64(f).then(function(v){
          b64 = v;
          return api('ql.nhapKhoExcel', { fileBase64: b64 });
        }).then(function(r){
          var canhBao =
            ((r.sheetBoQua && r.sheetBoQua.length)
              ? '<div class="chip warn mt">Bỏ qua ' + r.sheetBoQua.length + ' sheet không đúng định dạng ngày: ' +
                h(r.sheetBoQua.join(', ')) + '</div>' : '') +
            ((r.ngayTrungLap && r.ngayTrungLap.length)
              ? '<div class="chip warn mt">' + r.ngayTrungLap.length + ' ngày đã nhập từ Excel trước đó, sẽ bỏ qua: ' +
                h(r.ngayTrungLap.join(', ')) + '</div>' : '');
          $('#nkKq').innerHTML =
            '<div class="card tight">' +
              '<div class="spread small"><span>Số ngày đọc được</span><b>' + r.soNgay + '</b></div>' +
              '<div class="spread small"><span>Khoảng ngày</span><b>' + h(r.tuNgay) + ' &rarr; ' + h(r.denNgay) + '</b></div>' +
              '<div class="spread small"><span>Số dòng kiểm kho</span><b>' + r.soDong + '</b></div>' +
              '<div class="spread small"><span>Mặt hàng mới sẽ tạo</span><b>' + r.soHangMoi + '</b></div>' +
              (r.soHangMoi ? '<div class="xs muted mt">' + h(r.tenHangMoi.join(', ')) + '</div>' : '') +
            '</div>' + canhBao +
            (r.soDong || r.soHangMoi
              ? '<button class="btn block mt" id="nkOk">' +
                  (r.soDong ? 'Xác nhận nhập vào kho' : 'Bổ sung ' + r.soHangMoi + ' mặt hàng còn thiếu vào danh mục') + '</button>'
              : '<div class="small muted mt">Không có ngày nào mới để nhập, danh mục cũng đã đủ món.</div>');
          if (r.soDong || r.soHangMoi) $('#nkOk').onclick = function(){
            $('#nkOk').setAttribute('disabled', 'disabled');
            api('ql.nhapKhoExcel', { fileBase64: b64, xacNhan: true }).then(function(r2){
              dongSheet(); toast(r2.thongBao, 'ok', 8000); lamMoi();
            }).catch(function(err){ toast(err.message, 'err'); $('#nkOk').removeAttribute('disabled'); });
          };
        }).catch(function(err){
          $('#nkKq').innerHTML = '<div class="small" style="color:var(--err)">' + h(err.message) + '</div>';
        });
      };
    }
  });
}

VIEWS.q_ca = function(root, tham){
  var tu = tham.tu || homNay();
  var den = tham.den || congNgay(homNay(), 13);
  return api('ql.lichCa', { tuNgay: tu, denNgay: den }).then(function(d){
    S.cache.lichCa = d;
    var choDuyet = d.danhSach.filter(function(x){ return x.trangThai === 'ChoDuyet'; });
    var theoNgay = {};
    d.danhSach.forEach(function(x){ (theoNgay[x.ngay] = theoNgay[x.ngay] || []).push(x); });

function duyetCa(id, ok){

function duyetTatCa(){

    .map(function(x){ return x.id; });
  xacNhan('Duyệt tất cả ' + ids.length + ' ca đang chờ?', { ok:'Duyệt hết' }).then(function(y){
    if (!y) return;
    api('ql.duyetCa', { ids: ids, duyet: true }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });

}
var _chiaCaChon = {};
function moTuDongChiaCa(){
  var d0 = S.cache.lichCa;
  api('ql.goiYChiaCa', { tuNgay: d0.tu, denNgay: d0.den }).then(function(d){
    if (!d.danhSach.length){ toast('Không có ca nào đang chờ duyệt trong khoảng này.', 'warn'); return; }
    _chiaCaChon = {};
    d.danhSach.forEach(function(g){
      g.chon.forEach(function(x){ _chiaCaChon[x.id] = true; });
      g.khongChon.forEach(function(x){ _chiaCaChon[x.id] = false; });
    });

    var body =
      '<div class="xs muted mb">Ưu tiên người đang có ít ca hơn trong tuần. Bỏ tick / tick lại nếu muốn đổi trước khi áp dụng.</div>' +
      (d.canhBaoThieu.length
        ? '<div class="card tight mb"><b class="xs">&#9888; Thiếu người:</b><div class="xs muted">' +
          d.canhBaoThieu.map(h).join('<br>') + '</div></div>'
        : '') +
      d.danhSach.map(function(g){
        return '<div class="sec-title">' + h(thuCua(g.ngay)) + ' ' + h(ngayVN(g.ngay)) + ' · ' + h(g.tenCa) +
          ' (' + (g.can ? 'cần ' + g.can + ', ' : '') + 'đăng ký ' + g.soDangKy + ')</div>' +
          '<div class="card tight">' + g.chon.concat(g.khongChon).map(function(x){
            return '<div class="item"><div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
              '<div class="t2">Đang có ' + x.soCaTuan + ' ca trong tuần này</div></div>' +
              '<label style="display:flex;align-items:center;gap:6px">' +
              '<input type="checkbox" class="_ccChk" data-id="' + h(x.id) + '"' +
              (_chiaCaChon[x.id] ? ' checked' : '') + '> Nhận ca</label></div>';
          }).join('') + '</div>';
      }).join('') +
      '<button class="btn block" id="_ccApDung">Áp dụng chia ca</button>';

    moSheet({
      title: '&#129302; Gợi ý chia ca tự động',
      body: body,
      onMount: function(root){
        $$('._ccChk').forEach(function(e){
          e.onchange = function(){ _chiaCaChon[e.getAttribute('data-id')] = e.checked; };
        });
        $('#_ccApDung').onclick = function(){
          var idsChon = [], idsTuChoi = [];
          Object.keys(_chiaCaChon).forEach(function(id){
            (_chiaCaChon[id] ? idsChon : idsTuChoi).push(id);
          });
          xacNhan('Áp dụng: duyệt ' + idsChon.length + ' ca, từ chối ' + idsTuChoi.length + ' ca?', { ok:'Áp dụng' }).then(function(y){
            if (!y) return;
            api('ql.apDungChiaCa', { idsChon: idsChon, idsTuChoi: idsTuChoi }).then(function(r){
              dongSheet(); toast(r.thongBao, 'ok'); lamMoi();
            }).catch(function(e){ toast(e.message, 'err'); });
          });
        };
      }
    });
  }).catch(function(e){ toast(e.message, 'err'); });
}
function xoaLichCa(id){
  xacNhan('Xoá ca này khỏi lịch?', { ok:'Xoá', nguyHiem:true }).then(function(y){
    if (!y) return;
    api('ql.xoaLichCa', { id: id }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });
  });
}

var _xepChon = {};
function moXepCa(){
  _xepChon = {};
  var d = S.cache.lichCa;
  var ngays = [];
  for (var i = 0; i < 14; i++) ngays.push(congNgay(homNay(), i));

  moSheet({
    title: '📅 Xếp ca',
    body:
      '<label class="f"><span>Nhân viên</span><select class="inp" id="xcNV">' +
        d.dsNhanVien.map(function(x){ return '<option value="' + h(x.maNV) + '">' + h(x.hoTen) + '</option>'; }).join('') +
      '</select></label>' +
      '<p class="small muted">Chạm chọn các ca muốn xếp cho người này:</p>' +
      ngays.map(function(n){
        return '<div class="card tight" style="margin-bottom:8px">' +
          '<div class="small" style="font-weight:700;margin-bottom:6px">' + h(thuCua(n)) + ' ' + h(ngayVN(n)) + '</div>' +
          '<div class="row wrap">' + d.dsCa.map(function(c){
            return '<button class="btn sm ghost xc-chip" data-n="' + n + '" data-c="' + h(c.maCa) + '">' + h(c.tenCa) + '</button>';
          }).join('') + '</div></div>';
      }).join('') +
      '<button class="btn block" id="xcOk">Xếp ca (<span id="xcDem">0</span>)</button>',
    onMount: function(root){
      $$('.xc-chip', root).forEach(function(b){
        b.onclick = function(){
          var k = b.getAttribute('data-n') + '|' + b.getAttribute('data-c');
          if (_xepChon[k]){ delete _xepChon[k]; b.classList.add('ghost'); b.classList.remove('ok'); }
          else { _xepChon[k] = true; b.classList.remove('ghost'); b.classList.add('ok'); }
          $('#xcDem').textContent = Object.keys(_xepChon).length;
        };
      });
      $('#xcOk').onclick = function(){
        var ma = $('#xcNV').value;
        var items = Object.keys(_xepChon).map(function(k){
          var p = k.split('|'); return { maNV: ma, ngay: p[0], maCa: p[1] };
        });
        if (!items.length){ toast('Chưa chọn ca nào.', 'warn'); return; }
        api('ql.xepCa', { items: items }).then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
          .catch(function(e){ toast(e.message, 'err'); });
      };
    }
  });
}

        hint:'Dùng khi tự động chia ca. Để 0 = không giới hạn' },
      { k:'trangThai', label:'Trạng thái', type:'select', value:c.trangThai,
        options:[{ v:'HoatDong', t:'Đang dùng' }, { v:'Tat', t:'Tạm tắt' }] },
      { k:'ghiChu', label:'Ghi chú', type:'text', value:c.ghiChu }
    ]) + '<button class="btn block" id="_caOk">Lưu ca</button>',
    onMount: function(root){
      $('#_caOk').onclick = function(){
        api('ql.luuCa', fRead(root)).then(function(r){
          dongSheet(); toast(r.thongBao, 'ok'); S.cache.dsCa = null; lamMoi();
        }).catch(function(e){ toast(e.message, 'err'); });
      };
    }
  });
}
</script>

</body>
</html>
