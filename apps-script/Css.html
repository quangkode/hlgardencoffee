<style>
/* ===== Nền tảng ===== */
:root{
  --bg:#f6f1ea; --bg2:#efe7dc; --card:#ffffff; --card2:#faf6f1;
  --tx:#241a13; --tx2:#6d5c4e; --tx3:#9c8a7a;
  --line:#e6dbcd;
  --brand:#6f4e37; --brand2:#8a6449; --accent:#c8873f;
  --ok:#2e7d5b; --okbg:#e6f4ed;
  --warn:#b8791a; --warnbg:#fdf2e0;
  --err:#c0442e; --errbg:#fbe9e6;
  --info:#3b6ea5; --infobg:#e8f0f9;
  --sh:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px; --r2:12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14100d; --bg2:#1b1611; --card:#211a15; --card2:#28201a;
    --tx:#f2e9df; --tx2:#b8a695; --tx3:#8a7a6b; --line:#372c23;
    --brand:#c79466; --brand2:#a5784f; --accent:#e0a45f;
    --ok:#5cc496; --okbg:#163025; --warn:#e0a45f; --warnbg:#332616;
    --err:#f08a75; --errbg:#39201c; --info:#7fb0e8; --infobg:#1a2836;
    --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
}
input,select,textarea,button{font-family:inherit;font-size:16px}
.hidden{display:none !important}

/* ===== Khung ===== */
#app{min-height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg)}
@media(min-width:901px){ #app{box-shadow:0 0 40px rgba(0,0,0,.07);min-height:100vh} }

#topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
}
#topbar .tb-avatar{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto
}
#topbar .tb-name{font-weight:700;font-size:16px;line-height:1.2}
#topbar .tb-sub{font-size:12px;opacity:.85}
#topbar .tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-btn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.tb-btn:active{background:rgba(255,255,255,.3)}

#view{flex:1;padding:14px 14px calc(84px + var(--safe-b));min-height:0}

#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);max-width:900px;margin:0 auto;
}
#tabbar button{
  flex:1;border:0;background:none;color:var(--tx3);padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer
}
#tabbar button .ic{font-size:20px;line-height:1}
#tabbar button.on{color:var(--brand);font-weight:600}

/* ===== Thành phần ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.card.tight{padding:10px 12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.sec-title{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 8px}
.muted{color:var(--tx2)} .small{font-size:13px} .xs{font-size:12px}
.center{text-align:center} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mt{margin-top:10px} .mb{margin-bottom:10px} .nowrap{white-space:nowrap}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:600px){ .grid2{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:repeat(4,1fr)} }

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 10px;text-align:center}
.stat .v{font-size:20px;font-weight:800;line-height:1.2}
.stat .l{font-size:11px;color:var(--tx2);margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.err .v{color:var(--err)} .stat.brand .v{color:var(--brand)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand);color:#fff;border:0;border-radius:12px;
  padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;min-height:46px
}
.btn:active{opacity:.85;transform:scale(.99)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.err{background:var(--err)} .btn.warn{background:var(--warn)}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}

.big-action{
  width:100%;border:0;border-radius:20px;padding:22px 16px;color:#fff;
  font-size:19px;font-weight:800;cursor:pointer;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:6px
}
.big-action .sub{font-size:13px;font-weight:500;opacity:.9}
.big-action.in{background:linear-gradient(135deg,#2e7d5b,#3d9c72)}
.big-action.out{background:linear-gradient(135deg,#c0442e,#d9613f)}
.big-action[disabled]{opacity:.6}

label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.inp{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card2);color:var(--tx);outline:none
}
.inp:focus{border-color:var(--brand);background:var(--card)}
textarea.inp{min-height:70px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.err{background:var(--errbg);color:var(--err)}
.chip.info{background:var(--infobg);color:var(--info)}
.chip.grey{background:var(--bg2);color:var(--tx2)}

.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .av{width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.item .t1{font-weight:600;font-size:14px}
.item .t2{font-size:12px;color:var(--tx2)}

.empty{text-align:center;padding:28px 12px;color:var(--tx3)}
.empty .ic{font-size:38px;margin-bottom:8px;opacity:.5}

.tabs{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;color:var(--tx2);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;color:var(--tx2);text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:700}
table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ===== Đăng nhập ===== */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:linear-gradient(160deg,var(--brand),#3b2a1e)}
#loginScreen .lg-logo{text-align:center;color:#fff;margin-bottom:22px}
#loginScreen .lg-logo .ic{font-size:52px}
#loginScreen .lg-logo h1{margin:6px 0 2px;font-size:22px}
#loginScreen .lg-logo p{margin:0;opacity:.8;font-size:13px}
#loginScreen .lg-box{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#loginScreen .lg-err{background:var(--errbg);color:var(--err);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;white-space:pre-line}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{padding:14px 0;font-size:20px;font-weight:700;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;cursor:pointer}
.pinpad button:active{background:var(--bg2)}

/* ===== Toast / Loading / Modal ===== */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));z-index:100;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{
  background:#2b2119;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;
  margin-top:8px;box-shadow:0 6px 24px rgba(0,0,0,.3);white-space:pre-line;
  animation:tin .25s ease
}
.toast.ok{background:#1f6b4d}.toast.err{background:#a83a26}.toast.warn{background:#9a6415}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#loading{position:fixed;inset:0;background:rgba(20,14,10,.35);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(1px)}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#modal{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,14,10,.5)}
@media(min-width:640px){ #modal{align-items:center} }
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-b));
  animation:sup .22s ease
}
@media(min-width:640px){ .sheet{border-radius:20px;max-height:86vh} }
@keyframes sup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .close{margin-left:auto;background:var(--bg2);border:0;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--tx2);cursor:pointer}

/* ===== Danh sách kiểm kho ===== */
.kho-item{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.kho-item:last-child{border-bottom:0}
.kho-item .nm{font-size:14px;font-weight:600;line-height:1.25}
.kho-item .un{font-size:11px;color:var(--tx2)}
.kho-item .inp{padding:8px;text-align:center;font-size:15px}
.kho-head{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;font-size:10px;color:var(--tx2);text-transform:uppercase;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--line)}

.dayline{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}
.dayline .d{font-weight:700;font-size:13px}
.dayline .l{flex:1;height:1px;background:var(--line)}
</style>
