<script>
/*******************************************************
 * JsQuanLy — Màn hình phía quản lý
 *   q_home  Tổng quan (cập nhật gần thời gian thực)
 *   q_cc    Chấm công toàn quán
 *   q_luong Bảng lương
 *   q_kho   Kho
 *   q_them  Menu mở rộng -> q_ca, q_gc, q_nv, q_cd
 *******************************************************/

function nutQuayLai(nhan){
  return '<button class="btn sm ghost mb" onclick="go(\'q_them\')">&lsaquo; ' + h(nhan || 'Quay lại') + '</button>';
}

/* ================= TỔNG QUAN ================= */

VIEWS.q_home = function(root){
  return api('ql.tongQuan', {}).then(function(d){
    datLechGio(d.serverTime);

    var canhBao = [];
    if (d.quenChamRa) canhBao.push({ c:'err', t: d.quenChamRa + ' ca quên chấm ra (từ hôm trước)', go:"go('q_cc')" });
    if (d.caChoDuyet) canhBao.push({ c:'warn', t: d.caChoDuyet + ' ca đang chờ bạn duyệt', go:"go('q_ca')" });
    if (d.giaoCaChoXacNhan) canhBao.push({ c:'warn', t: d.giaoCaChoXacNhan + ' biên bản giao ca chưa xác nhận', go:"go('q_gc')" });
    if (d.ngoaiVung) canhBao.push({ c:'err', t: d.ngoaiVung + ' lượt chấm công ngoài vùng quán hôm nay', go:"go('q_cc')" });
    if (d.soCanhBaoKho) canhBao.push({ c:'warn', t: d.soCanhBaoKho + ' mặt hàng dưới định mức tồn', go:"go('q_kho')" });

    root.innerHTML =
      '<div class="card center" style="background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0">' +
        '<div class="xs" style="opacity:.85">' + h(thuCua(d.ngay)) + ', ' + h(ngayVN(d.ngay)) + '</div>' +
        '<div class="row center" style="justify-content:center;gap:8px;margin:6px 0">' +
          '<div style="font-size:34px;font-weight:800">' + d.dangLam + '</div>' +
          '<div style="text-align:left;line-height:1.2"><div style="font-weight:700">người</div>' +
          '<div class="xs" style="opacity:.85">đang trong ca</div></div>' +
        '</div>' +
        '<div class="xs" style="opacity:.85">Trên tổng ' + d.soNhanVien + ' nhân viên đang làm</div>' +
      '</div>' +

      (canhBao.length ? '<div class="card tight">' + canhBao.map(function(c){
        return '<div class="item" style="cursor:pointer" onclick="' + c.go + '">' +
          '<span class="chip ' + c.c + '">&#9888;</span><div class="grow small">' + h(c.t) + '</div>' +
          '<span class="muted">&rsaquo;</span></div>';
      }).join('') + '</div>' : '') +

      '<div class="sec-title">Hôm nay</div>' +
      '<div class="grid3">' +
        '<div class="stat brand"><div class="v">' + d.caHomNay + '</div><div class="l">Lượt ca</div></div>' +
        '<div class="stat"><div class="v">' + d.gioHomNay + '</div><div class="l">Giờ công</div></div>' +
        '<div class="stat ' + (d.treHomNay ? 'warn' : 'ok') + '"><div class="v">' + d.treHomNay + '</div><div class="l">Đi trễ</div></div>' +
      '</div>' +
      '<div class="grid3 mt">' +
        '<div class="stat"><div class="v" style="font-size:15px">' + tien(d.doanhThuHomNay) + '</div><div class="l">Doanh thu</div></div>' +
        '<div class="stat ' + (d.lechQuyHomNay ? 'err' : 'ok') + '"><div class="v" style="font-size:15px">' + tien(d.lechQuyHomNay) + '</div><div class="l">Lệch quỹ</div></div>' +
        '<div class="stat"><div class="v" style="font-size:15px">' + tien(d.tongLuongTamTinh) + '</div><div class="l">Lương ' + h(d.thangHienTai.slice(5)) + '/' + h(d.thangHienTai.slice(0,4)) + '</div></div>' +
      '</div>' +

      '<div class="sec-title">Đang trong ca <span class="xs muted" style="text-transform:none">(tự cập nhật 25 giây)</span></div>' +
      '<div id="qhLive"><div class="card center muted small">Đang tải…</div></div>' +

      '<div class="sec-title">Chấm công hôm nay</div>' +
      (d.danhSachHomNay.length ? '<div class="card tight">' + d.danhSachHomNay.map(function(x){
        return '<div class="item" style="cursor:pointer" onclick="suaChamCong(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')">' +
          '<div class="av">' + h(chuCai(x.hoTen)) + '</div>' +
          '<div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
          '<div class="t2">' + h(x.tenCa) + ' · ' + h(x.gioVao) + ' → ' + h(x.gioRa || '…') + '</div></div>' +
          '<div class="right">' +
            (x.trangThai === 'DangLam' ? '<span class="chip ok">Đang làm</span>'
              : '<span class="chip grey">' + soPhutRaGio(x.soPhutLam) + '</span>') +
            (x.soPhutTre > (S.cfg.phutTreChoPhep||5) ? '<div class="xs" style="color:var(--err)">trễ ' + x.soPhutTre + "'</div>" : '') +
            (x.ngoaiVung ? '<div class="xs" style="color:var(--err)">ngoài vùng</div>' : '') +
          '</div></div>';
      }).join('') + '</div>' : trong('&#128337;', 'Chưa ai chấm công hôm nay.')) +

      (d.canhBaoKho.length ? '<div class="sec-title">Hàng sắp hết</div><div class="card tight">' +
        d.canhBaoKho.map(function(k){
          return '<div class="item"><div class="grow small">' + h(k.tenHang) + '</div>' +
            '<span class="chip err">còn ' + k.con + ' ' + h(k.donVi) + ' / ĐM ' + k.dinhMuc + '</span></div>';
        }).join('') + '</div>' : '');

    veDangTrongCa();
    datPoll(veDangTrongCa, 25);
  });
};

function veDangTrongCa(){
  var box = $('#qhLive'); if (!box) return;
  api('ql.dangTrongCa', {}, { im:true }).then(function(d){
    var b = $('#qhLive'); if (!b) return;
    datLechGio(d.serverTime);
    b.innerHTML = d.danhSach.length ? '<div class="card tight">' + d.danhSach.map(function(x){
      return '<div class="item"><div class="av" style="background:' +
        (x.boQuen ? 'var(--errbg);color:var(--err)' : 'var(--okbg);color:var(--ok)') + '">&#9679;</div>' +
        '<div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
        '<div class="t2">' + h(x.tenCa || x.maCa) + ' · vào ' + h(x.gioVao) +
        (x.ngay !== homNay() ? ' (' + h(ngayNgan(x.ngay)) + ')' : '') + '</div></div>' +
        '<div class="right">' +
        (x.boQuen ? '<span class="chip err">quên chấm ra</span>' : '<b>' + soPhutRaGio(x.daLamPhut) + '</b>') +
        (x.ngoaiVung ? '<div class="xs" style="color:var(--err)">ngoài vùng</div>' : '') + '</div></div>';
    }).join('') + '</div>' : '<div class="card tight center muted small">Hiện không có ai đang trong ca.</div>';
  }).catch(function(){});
}

/* ================= CHẤM CÔNG (QL) ================= */

VIEWS.q_cc = function(root, tham){
  var tu = tham.tu || congNgay(homNay(), -13);
  var den = tham.den || homNay();
  var maNV = tham.maNV || '';

  return Promise.all([api('ql.chamCong', { tuNgay: tu, denNgay: den, maNV: maNV }), api('ql.dsNhanVien')])
    .then(function(r){
      var d = r[0], nvs = r[1].danhSach.filter(function(x){ return x.trangThai === 'DangLam'; });
      S.cache.nvs = r[1].danhSach;

      var theoNgay = {};
      d.danhSach.forEach(function(x){ (theoNgay[x.ngay] = theoNgay[x.ngay] || []).push(x); });
      var ngays = Object.keys(theoNgay).sort().reverse();

      root.innerHTML =
        '<div class="card">' +
          '<div class="grid2">' +
            '<label class="f"><span>Từ ngày</span><input class="inp" type="date" id="fTu" value="' + h(tu) + '"></label>' +
            '<label class="f"><span>Đến ngày</span><input class="inp" type="date" id="fDen" value="' + h(den) + '"></label>' +
          '</div>' +
          '<label class="f"><span>Nhân viên</span><select class="inp" id="fNV"><option value="">— Tất cả —</option>' +
            nvs.map(function(x){ return '<option value="' + h(x.maNV) + '"' + (x.maNV === maNV ? ' selected' : '') + '>' + h(x.hoTen) + '</option>'; }).join('') +
          '</select></label>' +
          '<div class="row"><button class="btn grow" id="fLoc">Xem</button>' +
          '<button class="btn ghost grow" onclick="themChamCong()">&#10133; Nhập công tay</button></div>' +
        '</div>' +

        '<div class="grid2">' +
          '<div class="stat brand"><div class="v">' + d.tong.soCa + '</div><div class="l">Lượt ca</div></div>' +
          '<div class="stat"><div class="v">' + d.tong.tongGio + '</div><div class="l">Tổng giờ công</div></div>' +
        '</div>' +

        (ngays.length ? ngays.map(function(n){
          return '<div class="dayline"><div class="d">' + h(thuCua(n)) + ' ' + h(ngayVN(n)) + '</div><div class="l"></div></div>' +
            '<div class="card tight">' + theoNgay[n].map(function(x){
              return '<div class="item" style="cursor:pointer" onclick="suaChamCong(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')">' +
                '<div class="av">' + h(chuCai(x.hoTen)) + '</div>' +
                '<div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
                '<div class="t2">' + h(x.tenCa) + ' · ' + h(x.gioVao) + ' → ' + h(x.gioRa || '…') +
                (x.nguoiSua ? ' · <i>đã sửa</i>' : '') + '</div></div>' +
                '<div class="right">' +
                  (x.trangThai === 'DangLam' ? '<span class="chip ok">Đang làm</span>'
                    : '<b>' + soPhutRaGio(x.soPhutLam) + '</b>') +
                  (x.soPhutTre > (S.cfg.phutTreChoPhep||5) ? '<div class="xs" style="color:var(--err)">trễ ' + x.soPhutTre + "'</div>" : '') +
                  (x.ngoaiLich ? '<div class="xs" style="color:var(--warn)">ngoài lịch</div>' : '') +
                  (x.ngoaiVung ? '<div class="xs" style="color:var(--err)">ngoài vùng' +
                    (x.khoangCachVao !== '' ? ' ' + x.khoangCachVao + 'm' : '') + '</div>' : '') +
                '</div></div>';
            }).join('') + '</div>';
        }).join('') : trong('&#128337;', 'Không có dữ liệu chấm công trong khoảng này.'));

      $('#fLoc').onclick = function(){
        go('q_cc', { tu: $('#fTu').value, den: $('#fDen').value, maNV: $('#fNV').value });
      };
    });
};

function suaChamCong(x){
  var dsCa = S.cache.dsCa;
  var lay = dsCa ? Promise.resolve(dsCa) : api('ca.danhSachCa').then(function(c){ S.cache.dsCa = c; return c; });
  lay.then(function(cas){
    moSheet({
      title: '✏️ Sửa công · ' + x.hoTen,
      body:
        '<div class="xs muted mb">' + h(x.maNV) + ' · ' + h(ngayVN(x.ngay)) +
        (x.anhVao ? ' · <a href="' + h(x.anhVao) + '" target="_blank">ảnh vào</a>' : '') +
        (x.anhRa ? ' · <a href="' + h(x.anhRa) + '" target="_blank">ảnh ra</a>' : '') + '</div>' +
        fForm([
          { k:'ngay', label:'Ngày', type:'date', value:x.ngay },
          { k:'maCa', label:'Ca', type:'select', value:x.maCa,
            options: cas.map(function(c){ return { v:c.maCa, t:c.tenCa + ' (' + c.gioBatDau + '–' + c.gioKetThuc + ')' }; }) },
          { k:'gioVao', label:'Giờ vào', type:'time', value:x.gioVao },
          { k:'gioRa', label:'Giờ ra (để trống = chưa ra)', type:'time', value:x.gioRa },
          { k:'ghiChu', label:'Ghi chú', type:'textarea', value:x.ghiChu }
        ]) +
        '<div class="row"><button class="btn err" id="_ccXoa">Xoá</button>' +
        '<button class="btn grow" id="_ccLuu">Lưu</button></div>',
      onMount: function(root){
        $('#_ccLuu').onclick = function(){
          var d = fRead(root); d.id = x.id;
          api('ql.suaChamCong', d).then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
            .catch(function(e){ toast(e.message, 'err'); });
        };
        $('#_ccXoa').onclick = function(){
          xacNhan('Xoá hẳn bản ghi chấm công này?', { ok:'Xoá', nguyHiem:true }).then(function(y){
            if (!y) return;
            api('ql.xoaChamCong', { id: x.id }).then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
              .catch(function(e){ toast(e.message, 'err'); });
          });
        };
      }
    });
  });
}

function themChamCong(){
  var nvs = (S.cache.nvs || []).filter(function(x){ return x.trangThai === 'DangLam'; });
  var lay = S.cache.dsCa ? Promise.resolve(S.cache.dsCa) : api('ca.danhSachCa').then(function(c){ S.cache.dsCa = c; return c; });
  lay.then(function(cas){
    moSheet({
      title: '➕ Nhập công thủ công',
      body: fForm([
        { k:'maNV', label:'Nhân viên', type:'select', options: nvs.map(function(x){ return { v:x.maNV, t:x.hoTen }; }) },
        { k:'ngay', label:'Ngày', type:'date', value: homNay() },
        { k:'maCa', label:'Ca', type:'select', options: cas.map(function(c){ return { v:c.maCa, t:c.tenCa }; }) },
        { k:'gioVao', label:'Giờ vào', type:'time' },
        { k:'gioRa', label:'Giờ ra', type:'time' },
        { k:'ghiChu', label:'Lý do nhập tay', type:'text', value:'Quản lý nhập tay' }
      ]) + '<button class="btn block" id="_tcOk">Lưu công</button>',
      onMount: function(root){
        $('#_tcOk').onclick = function(){
          api('ql.themChamCong', fRead(root))
            .then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
            .catch(function(e){ toast(e.message, 'err'); });
        };
      }
    });
  });
}

/* ================= BẢNG LƯƠNG ================= */

VIEWS.q_luong = function(root, tham){
  var thang = tham.thang || thangISO(new Date(Date.now() + S.lechGio));
  return Promise.all([api('ql.bangLuong', { thang: thang }), api('ql.thuongPhat', { thang: thang })])
    .then(function(r){
      var d = r[0], tp = r[1];
      S.cache.luongThang = thang;

      root.innerHTML =
        '<div class="card tight"><div class="spread">' +
          '<button class="btn sm ghost" onclick="go(\'q_luong\',{thang:\'' + luiThang(thang,-1) + '\'})">&lsaquo;</button>' +
          '<div style="font-weight:700">' + h(thangVN(thang)) + '</div>' +
          '<button class="btn sm ghost" onclick="go(\'q_luong\',{thang:\'' + luiThang(thang,1) + '\'})">&rsaquo;</button>' +
        '</div></div>' +

        '<div class="grid2">' +
          '<div class="stat brand"><div class="v" style="font-size:17px">' + tien(d.tong.tongLuong) + '</div><div class="l">Tổng phải trả</div></div>' +
          '<div class="stat"><div class="v">' + d.tong.tongGio + '</div><div class="l">Tổng giờ công</div></div>' +
          '<div class="stat ok"><div class="v" style="font-size:15px">' + tien(d.tong.tongThuong) + '</div><div class="l">Thưởng</div></div>' +
          '<div class="stat err"><div class="v" style="font-size:15px">' + tien(d.tong.tongPhat) + '</div><div class="l">Phạt</div></div>' +
        '</div>' +

        '<div class="row mt mb"><button class="btn ghost grow" onclick="moThuongPhat()">&#127942; Thưởng / phạt</button>' +
        '<button class="btn grow" onclick="chotLuong(\'' + thang + '\')">&#128190; Chốt lương</button></div>' +

        (d.danhSach.length ? '<div class="card tight">' + d.danhSach.map(function(x){
          return '<div class="item" style="cursor:pointer" onclick="chiTietLuong(\'' + x.maNV + '\')">' +
            '<div class="av">' + h(chuCai(x.hoTen)) + '</div>' +
            '<div class="grow"><div class="t1">' + h(x.hoTen) +
              (x.trangThaiNV !== 'DangLam' ? ' <span class="chip grey">nghỉ</span>' : '') + '</div>' +
            '<div class="t2">' + x.soCa + ' ca · ' + x.tongGio + 'h · ' + tien(x.luongTheoGio) + '/h' +
            (x.soLanTre ? ' · trễ ' + x.soLanTre : '') + '</div></div>' +
            '<div class="right"><b style="color:var(--brand)">' + tien(x.thucNhan) + '</b>' +
            (x.daChot === 'DaChot' ? '<div class="xs" style="color:var(--ok)">đã chốt</div>' : '') + '</div></div>';
        }).join('') + '</div>' : trong('&#128176;', 'Chưa có dữ liệu lương tháng này.')) +

        (tp.danhSach.length ? '<div class="sec-title">Thưởng / phạt đã ghi</div><div class="card tight">' +
          tp.danhSach.map(function(x){
            return '<div class="item"><div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
              '<div class="t2">' + h(x.lyDo || '(không ghi lý do)') + '</div></div>' +
              '<b style="color:' + (x.loai === 'Thuong' ? 'var(--ok)' : 'var(--err)') + '">' +
              (x.loai === 'Thuong' ? '+' : '−') + tien(x.soTien) + '</b>' +
              '<button class="btn sm ghost" onclick="xoaThuongPhat(\'' + x.id + '\')">&times;</button></div>';
          }).join('') + '</div>' : '');
    });
};

function chiTietLuong(maNV){
  var thang = S.cache.luongThang;
  api('ql.bangLuong', { thang: thang, maNV: maNV }).then(function(d){
    var x = d.danhSach[0];
    if (!x){ toast('Không có dữ liệu.', 'warn'); return; }
    moSheet({
      title: '💰 ' + x.hoTen + ' · ' + thangVN(thang),
      body:
        '<div class="card tight">' +
          dongTien(x.tongGio + ' giờ × ' + tien(x.luongTheoGio) + '/giờ (' + x.soCa + ' ca)', x.luongCa) +
          (x.phuCap ? dongTien('Phụ cấp ca', x.phuCap) : '') +
          (x.thuong ? dongTien('Thưởng', x.thuong, 'ok') : '') +
          (x.phat ? dongTien('Phạt', -x.phat, 'err') : '') +
          '<hr class="sep">' + dongTien('<b>Thực nhận</b>', x.thucNhan, 'brand') +
          (x.soLanTre ? '<div class="xs muted mt">Đi trễ ' + x.soLanTre + ' lần (không trừ lương)</div>' : '') +
        '</div>' +
        '<div class="sec-title">Chi tiết từng ca</div>' +
        '<div class="card tight"><div class="scrollx"><table class="tbl">' +
        '<tr><th>Ngày</th><th>Ca</th><th>Giờ</th><th class="right">Tiền</th></tr>' +
        x.chiTiet.map(function(c){
          return '<tr><td class="nowrap">' + h(ngayNgan(c.ngay)) + '</td>' +
            '<td>' + h(c.maCa) + '</td>' +
            '<td class="nowrap">' + h(c.gioVao) + '-' + h(c.gioRa) + '<br><span class="xs muted">' + c.gio + 'h' +
            (c.soPhutTre > 0 ? ' · trễ ' + c.soPhutTre + "'" : '') + '</span></td>' +
            '<td class="right nowrap">' + tien(c.thanhTien) + '</td></tr>';
        }).join('') + '</table></div></div>' +
        '<button class="btn ghost block" onclick="dongSheet();moThuongPhat(\'' + x.maNV + '\')">Thêm thưởng / phạt cho ' + h(x.hoTen) + '</button>'
    });
  }).catch(function(e){ toast(e.message, 'err'); });
}

function moThuongPhat(maNV){
  var nvs = (S.cache.nvs || []).filter(function(x){ return x.trangThai === 'DangLam'; });
  var lay = nvs.length ? Promise.resolve(nvs)
    : api('ql.dsNhanVien').then(function(r){ S.cache.nvs = r.danhSach; return r.danhSach.filter(function(x){ return x.trangThai === 'DangLam'; }); });

  lay.then(function(list){
    moSheet({
      title: '🏆 Thưởng / phạt',
      body: fForm([
        { k:'maNV', label:'Nhân viên', type:'select', value: maNV || '',
          options: list.map(function(x){ return { v:x.maNV, t:x.hoTen }; }) },
        { k:'thang', label:'Áp dụng cho tháng', type:'month', value: S.cache.luongThang },
        { k:'loai', label:'Loại', type:'select', options:[{ v:'Thuong', t:'Thưởng (cộng tiền)' }, { v:'Phat', t:'Phạt (trừ tiền)' }] },
        { k:'soTien', label:'Số tiền (đồng)', type:'number', ph:'VD: 200000' },
        { k:'lyDo', label:'Lý do', type:'text', ph:'VD: doanh thu vượt chỉ tiêu' }
      ]) + '<button class="btn block" id="_tpOk">Lưu</button>',
      onMount: function(root){
        $('#_tpOk').onclick = function(){
          api('ql.luuThuongPhat', fRead(root))
            .then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
            .catch(function(e){ toast(e.message, 'err'); });
        };
      }
    });
  });
}

function xoaThuongPhat(id){
  xacNhan('Xoá mục thưởng/phạt này?', { ok:'Xoá', nguyHiem:true }).then(function(y){
    if (!y) return;
    api('ql.xoaThuongPhat', { id: id }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });
  });
}

function chotLuong(thang){

            '<td class="right">' + x.tonHienTai + ' <span class="xs muted">' + h(x.donVi) + '</span></td>' +

        (p.items.filter(function(i){ return i.ghiChu; }).length

              .map(function(i){ return i.tenHang + ': ' + i.ghiChu; }).join(' · ')) + '</div>' : '') +

VIEWS.q_ca = function(root, tham){

      '<button class="btn block mb" onclick="moXepCa()">&#10133; Xếp ca cho nhân viên</button>' +

        ? '<div class="sec-title">Chờ duyệt (' + choDuyet.length + ')</div>' +
          '<div class="card tight">' + choDuyet.map(function(x){
            return '<div class="item"><div class="av">' + h(chuCai(x.hoTen)) + '</div>' +
              '<div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
              '<div class="t2">' + h(thuCua(x.ngay)) + ' ' + h(ngayVN(x.ngay)) + ' · ' + h(x.tenCa) +
              (x.ghiChuNV ? ' · "' + h(x.ghiChuNV) + '"' : '') + '</div></div>' +
              '<button class="btn sm err" onclick="duyetCa(\'' + x.id + '\',false)">&times;</button>' +
              '<button class="btn sm ok" onclick="duyetCa(\'' + x.id + '\',true)">&#10003;</button></div>';
          }).join('') + '</div>' +
          '<button class="btn ok block mb" onclick="duyetTatCa()">Duyệt tất cả ' + choDuyet.length + ' ca</button>'
        : '') +

      (ngays.length ? ngays.map(function(n){
        return '<div class="dayline"><div class="d">' + h(thuCua(n)) + ' ' + h(ngayVN(n)) + '</div><div class="l"></div></div>' +
          '<div class="card tight">' + theoNgay[n].map(function(x){
            var tt = TT_CA[x.trangThai] || { t:x.trangThai, c:'grey' };
            return '<div class="item"><div class="grow"><div class="t1">' + h(x.hoTen) + '</div>' +
              '<div class="t2">' + h(x.tenCa) + ' ' + h(x.gioBatDau) + '–' + h(x.gioKetThuc) + '</div></div>' +
              '<span class="chip ' + tt.c + '">' + h(tt.t) + '</span>' +
              '<button class="btn sm ghost" onclick="xoaLichCa(\'' + x.id + '\')">&times;</button></div>';
          }).join('') + '</div>';

    $('#lLoc').onclick = function(){ go('q_ca', { tu: $('#lTu').value, den: $('#lDen').value }); };

function duyetCa(id, ok){
  api('ql.duyetCa', { id: id, duyet: ok }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
    .catch(function(e){ toast(e.message, 'err'); });
}
function duyetTatCa(){
  var ids = S.cache.lichCa.danhSach.filter(function(x){ return x.trangThai === 'ChoDuyet'; })
    .map(function(x){ return x.id; });
  xacNhan('Duyệt tất cả ' + ids.length + ' ca đang chờ?', { ok:'Duyệt hết' }).then(function(y){
    if (!y) return;
    api('ql.duyetCa', { ids: ids, duyet: true }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });
  });
}
function xoaLichCa(id){
  xacNhan('Xoá ca này khỏi lịch?', { ok:'Xoá', nguyHiem:true }).then(function(y){
    if (!y) return;
    api('ql.xoaLichCa', { id: id }).then(function(r){ toast(r.thongBao, 'ok'); lamMoi(); })
      .catch(function(e){ toast(e.message, 'err'); });
  });
}

var _xepChon = {};
function moXepCa(){
  _xepChon = {};
  var d = S.cache.lichCa;
  var ngays = [];
  for (var i = 0; i < 14; i++) ngays.push(congNgay(homNay(), i));

  moSheet({
    title: '📅 Xếp ca',
    body:
      '<label class="f"><span>Nhân viên</span><select class="inp" id="xcNV">' +
        d.dsNhanVien.map(function(x){ return '<option value="' + h(x.maNV) + '">' + h(x.hoTen) + '</option>'; }).join('') +
      '</select></label>' +
      '<p class="small muted">Chạm chọn các ca muốn xếp cho người này:</p>' +
      ngays.map(function(n){
        return '<div class="card tight" style="margin-bottom:8px">' +
          '<div class="small" style="font-weight:700;margin-bottom:6px">' + h(thuCua(n)) + ' ' + h(ngayVN(n)) + '</div>' +
          '<div class="row wrap">' + d.dsCa.map(function(c){
            return '<button class="btn sm ghost xc-chip" data-n="' + n + '" data-c="' + h(c.maCa) + '">' + h(c.tenCa) + '</button>';
          }).join('') + '</div></div>';
      }).join('') +
      '<button class="btn block" id="xcOk">Xếp ca (<span id="xcDem">0</span>)</button>',
    onMount: function(root){
      $$('.xc-chip', root).forEach(function(b){
        b.onclick = function(){
          var k = b.getAttribute('data-n') + '|' + b.getAttribute('data-c');
          if (_xepChon[k]){ delete _xepChon[k]; b.classList.add('ghost'); b.classList.remove('ok'); }
          else { _xepChon[k] = true; b.classList.remove('ghost'); b.classList.add('ok'); }
          $('#xcDem').textContent = Object.keys(_xepChon).length;
        };
      });
      $('#xcOk').onclick = function(){
        var ma = $('#xcNV').value;
        var items = Object.keys(_xepChon).map(function(k){
          var p = k.split('|'); return { maNV: ma, ngay: p[0], maCa: p[1] };
        });
        if (!items.length){ toast('Chưa chọn ca nào.', 'warn'); return; }
        api('ql.xepCa', { items: items }).then(function(r){ dongSheet(); toast(r.thongBao, 'ok'); lamMoi(); })
          .catch(function(e){ toast(e.message, 'err'); });
      };
    }
  });
}

      if ($('#_nvPin')) $('#_nvPin').onclick = function(){
        xacNhan('Reset PIN của ' + x.hoTen + ' về 1234?', { ok:'Reset PIN' }).then(function(y){
          if (!y) return;
          api('ql.resetPin', { maNV: x.maNV, pin: '1234' })
            .then(function(r){ dongSheet(); toast(r.thongBao, 'ok', 5000); lamMoi(); })
            .catch(function(e){ toast(e.message, 'err'); });
        });
      };
    }
  });
}

/* ================= CÀI ĐẶT ================= */

var NHAN_CAI_DAT = {
  tenQuan:               { l:'Tên quán', t:'text' },
  diaChiQuan:            { l:'Địa chỉ quán', t:'text' },
  latQuan:               { l:'Vĩ độ quán (latitude)', t:'text' },
  lngQuan:               { l:'Kinh độ quán (longitude)', t:'text' },
  banKinhChamCong:       { l:'Bán kính cho phép chấm công (mét)', t:'number', hint:'0 = không kiểm tra vị trí' },
  batBuocViTri:          { l:'Bắt buộc bật GPS khi chấm công', t:'checkbox' },
  chanNgoaiVung:         { l:'Chặn hẳn nếu đứng ngoài bán kính', t:'checkbox', hint:'Tắt = vẫn cho chấm nhưng gắn cờ đỏ để bạn xem' },
  yeuCauAnh:             { l:'Bắt chụp ảnh khi chấm công', t:'checkbox', hint:'Ảnh lưu vào Google Drive của bạn' },
  phutTreChoPhep:        { l:'Trễ quá bao nhiêu phút thì hiện cảnh báo', t:'number', hint:'Chỉ để bạn theo dõi, không trừ tiền lương' },
  luongGioMacDinh:       { l:'Lương/giờ mặc định (đồng)', t:'number' },
  phuCapCaMacDinh:       { l:'Phụ cấp thêm mỗi ca (đồng)', t:'number', hint:'Để 0 nếu chỉ trả lương theo giờ' },
  nguongPhutTinhPhuCap:  { l:'Số phút tối thiểu để được phụ cấp ca', t:'number' },
  lamTronPhut:           { l:'Làm tròn phút công theo bội số', t:'number', hint:'VD: 5 → 68 phút thành 70 phút. 0 = không làm tròn' },
  choPhepTuDangKyCa:     { l:'Cho nhân viên tự báo ca', t:'checkbox' },
  hanBaoCaTruoc:         { l:'Phải báo ca trước ít nhất (ngày)', t:'number' },
  batBuocKiemKhoCuoiCa:  { l:'Nhắc kiểm kho cuối ca', t:'checkbox' },
  thoiGianPhienDangNhap: { l:'Giữ đăng nhập (phút)', t:'number', hint:'720 = 12 tiếng' }
};

VIEWS.q_cd = function(root){
  return api('ql.docCaiDat').then(function(d){
    var map = {};
    d.caiDat.forEach(function(r){ map[r.key] = r.value; });

    var fields = Object.keys(NHAN_CAI_DAT).map(function(k){
      var m = NHAN_CAI_DAT[k];
      return { k:k, label:m.l, type:m.t, hint:m.hint,
               value: m.t === 'checkbox' ? (String(map[k]).toUpperCase() === 'TRUE') : (map[k] || '') };
    });

    root.innerHTML = nutQuayLai() +
      '<div class="card"><h3>&#128205; Vị trí quán</h3>' +
        '<p class="small muted">Đứng tại quán rồi bấm nút dưới để ghi toạ độ. Nhân viên chỉ chấm công được trong bán kính bạn đặt.</p>' +
        '<button class="btn block" id="cdGPS">Lấy vị trí hiện tại làm vị trí quán</button>' +
        '<div class="xs muted mt" id="cdGPSKq">' +
          (map.latQuan ? 'Hiện tại: ' + h(map.latQuan) + ', ' + h(map.lngQuan) : 'Chưa đặt vị trí quán') + '</div>' +
      '</div>' +

      '<div class="card"><h3>&#9881; Thông số</h3><div id="cdForm">' + fForm(fields) + '</div>' +
      '<button class="btn block" id="cdLuu">Lưu cài đặt</button></div>' +

      '<div class="sec-title">Ca làm việc</div>' +
      '<div class="card tight">' + d.dsCa.map(function(c){
        return '<div class="item" style="cursor:pointer" onclick="suaCa(' + JSON.stringify(c).replace(/"/g,'&quot;') + ')">' +
          '<div class="grow"><div class="t1">' + h(c.tenCa) +
          (c.trangThai !== 'HoatDong' ? ' <span class="chip grey">tắt</span>' : '') + '</div>' +
          '<div class="t2">' + h(c.maCa) + ' · ' + h(c.gioBatDau) + '–' + h(c.gioKetThuc) +
          (c.soPhutNghi ? ' · nghỉ ' + c.soPhutNghi + "'" : '') + '</div></div>' +
          '<span class="muted">&rsaquo;</span></div>';
      }).join('') + '</div>' +
      '<button class="btn ghost block mb" onclick="suaCa(null)">&#10133; Thêm ca làm việc</button>' +
      '<a class="btn ghost block" href="' + h(d.linkSheet) + '" target="_blank">&#128202; Mở file Google Sheets</a>';

    $('#cdGPS').onclick = function(){
      $('#cdGPSKq').textContent = 'Đang lấy vị trí…';
      layViTri(15000).then(function(v){
        if (!v){ $('#cdGPSKq').textContent = 'Không lấy được vị trí. Bật GPS và cho phép truy cập.'; return; }
        $('#f_latQuan').value = v.lat.toFixed(6);
        $('#f_lngQuan').value = v.lng.toFixed(6);
        $('#cdGPSKq').textContent = 'Đã điền: ' + v.lat.toFixed(6) + ', ' + v.lng.toFixed(6) +
                                     ' (sai số ~' + v.acc + 'm). Bấm "Lưu cài đặt" để áp dụng.';
      });
    };

    $('#cdLuu').onclick = function(){
      api('ql.luuCaiDat', { caiDat: fRead($('#cdForm')) }).then(function(r){
        S.cfg = r.cauHinh || S.cfg;
        toast(r.thongBao, 'ok'); lamMoi();
      }).catch(function(e){ toast(e.message, 'err'); });
    };
  });
};

function suaCa(c){
  var moi = !c;
  c = c || { maCa:'', tenCa:'', gioBatDau:'06:00', gioKetThuc:'12:00', soPhutNghi:0, trangThai:'HoatDong', ghiChu:'' };
  moSheet({
    title: moi ? '🕐 Thêm ca làm việc' : '🕐 ' + c.tenCa,
    body: fForm([
      { k:'maCa', label:'Mã ca', type:'text', value:c.maCa, ph:'VD: CA4', attrs: moi ? 'autocapitalize="characters"' : 'readonly' },
      { k:'tenCa', label:'Tên ca', type:'text', value:c.tenCa, ph:'VD: Ca đêm' },
      { k:'gioBatDau', label:'Giờ bắt đầu', type:'time', value:c.gioBatDau },
      { k:'gioKetThuc', label:'Giờ kết thúc', type:'time', value:c.gioKetThuc, hint:'Nhỏ hơn giờ bắt đầu = ca qua đêm' },
      { k:'soPhutNghi', label:'Số phút nghỉ giữa ca (trừ khỏi công)', type:'number', value:c.soPhutNghi },
      { k:'trangThai', label:'Trạng thái', type:'select', value:c.trangThai,
        options:[{ v:'HoatDong', t:'Đang dùng' }, { v:'Tat', t:'Tạm tắt' }] },
      { k:'ghiChu', label:'Ghi chú', type:'text', value:c.ghiChu }
    ]) + '<button class="btn block" id="_caOk">Lưu ca</button>',
    onMount: function(root){
      $('#_caOk').onclick = function(){
        api('ql.luuCa', fRead(root)).then(function(r){
          dongSheet(); toast(r.thongBao, 'ok'); S.cache.dsCa = null; lamMoi();
        }).catch(function(e){ toast(e.message, 'err'); });
      };
    }
  });
}
</script>
